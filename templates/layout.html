<style>
.notification-widget{font-family:var(--l2e-font,system-ui);flex-shrink:0}.notification-toggle{position:relative;display:grid;place-items:center;min-width:44px;min-height:44px;border:1px solid var(--l2e-border,#c8d6cf);border-radius:10px;background:var(--l2e-surface,#fff);color:var(--l2e-text,#142d26);cursor:pointer}.notification-badge{position:absolute;top:-6px;right:-6px;background:var(--l2e-accent,#08734d);color:var(--l2e-on-accent,#fff);font:700 .75rem/1.4 system-ui;min-width:20px;border:2px solid var(--l2e-surface,#fff);border-radius:99px;padding:1px 4px}.notification-panel{position:fixed;inset:12px 16px auto auto;margin:0;width:min(440px,calc(100vw - 32px));max-height:calc(100dvh - 24px);overflow:hidden;background:var(--l2e-surface,#fff);color:var(--l2e-text,#142d26);border:1px solid var(--l2e-border,#c8d6cf);box-shadow:var(--l2e-shadow,0 16px 50px #17253730);border-radius:18px;padding:0;box-sizing:border-box;font:1rem/1.5 var(--l2e-font,system-ui)}.notification-panel[open]{display:flex;flex-direction:column}.notification-panel::backdrop{background:#0008}.notification-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px;flex-shrink:0}.notification-heading h2{font-size:1.3rem;margin:0}.notification-panel button{font:700 .875rem/1.4 var(--l2e-font,system-ui);cursor:pointer;min-height:44px;min-width:44px;background:var(--l2e-subtle,#edf3f0);color:var(--l2e-text,#142d26);border:1px solid var(--l2e-border,#c8d6cf);border-radius:10px;padding:10px 12px}.notification-panel button:disabled{opacity:.6;cursor:wait}.notification-scroll{overflow:auto;min-height:0;padding:0 20px 20px;overscroll-behavior:contain}.notification-panel ul{list-style:none;padding:0;margin:0}.notification-item{border:1px solid var(--l2e-border,#c8d6cf);border-radius:12px;padding:16px;margin:12px 0;overflow-wrap:anywhere}.notification-item.unread{border-left:4px solid var(--l2e-accent,#08734d);background:var(--l2e-accent-soft,#e4f4ec)}.notification-item a{color:inherit;text-decoration:none;display:block;min-height:44px}.notification-item a:hover strong{text-decoration:underline}.notification-item strong{font-size:1rem}.notification-item p{font-size:1rem;line-height:1.5;margin:8px 0}.notification-item time,.notification-status{font-size:.875rem;color:var(--l2e-secondary,#4f655d);line-height:1.5}.notification-state{display:block;font-size:.875rem;font-weight:750;color:var(--l2e-accent,#08734d);margin-bottom:8px}.notification-item button{margin-top:12px}.notification-actions{display:flex;flex-wrap:wrap;gap:10px;padding:16px 20px;border-top:1px solid var(--l2e-border,#c8d6cf);flex-shrink:0}.notification-actions button{flex:1}.notification-status.is-error{color:var(--l2e-error,#a32931)}.notification-widget [hidden]{display:none!important}.notification-widget :focus-visible{outline:3px solid var(--l2e-focus,#08734d);outline-offset:3px}.notification-panel #notification-older{width:100%;margin-top:12px}@media(max-width:600px){.notification-panel{inset:auto 12px 12px;width:calc(100vw - 24px);max-height:calc(100dvh - 24px);border-radius:18px}.notification-heading{padding:16px}.notification-scroll{padding-inline:16px}}
</style>
<section class="notification-widget" id="notification-widget" aria-label="Your notifications">
<button type="button" class="notification-toggle" id="notification-toggle" aria-label="Notifications" aria-expanded="false" aria-controls="notification-panel" aria-haspopup="dialog"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span class="notification-badge" id="notification-badge" hidden aria-hidden="true"></span></button>
<dialog class="notification-panel" id="notification-panel" hidden aria-labelledby="notification-title">
<header class="notification-heading"><h2 id="notification-title">Notifications</h2><button type="button" id="notification-close" aria-label="Close notifications">Close</button></header>
<div class="notification-scroll"><p class="notification-status" id="notification-status" role="status" aria-live="polite">Loading notifications…</p><ul id="notification-items" aria-busy="true"></ul><button type="button" id="notification-older" hidden>Show older</button></div>
<footer class="notification-actions"><button type="button" id="notification-read-all">Mark all read</button><button type="button" id="notification-refresh">Refresh</button></footer>
</dialog></section>
