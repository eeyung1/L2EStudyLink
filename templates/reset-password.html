<!DOCTYPE html>
<html>
<head>
    <title>Reset Password - L2EStudyLink</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
    <div class="max-w-md mx-auto">
        <div class="rounded-lg shadow p-8" style="background:#12151f; color:#e5e7eb; border:1px solid rgba(255,255,255,0.08);">
            <h1 class="text-2xl font-bold text-center mb-6" style="color:#7c3aed;"><a class="auth-brand-link" href="/">L2EStudyLink</a></h1>
            <h2 class="text-xl font-bold mb-6 text-center">Reset Password</h2>

            <p class="text-center text-sm mb-6" style="color:#9ca3af;">Enter the six-digit code sent to your email. It expires in 10 minutes.</p>

            <form id="resetForm">
                <div class="mb-4">
                    <label for="email" class="block text-sm font-bold mb-2" style="color:#d1d5db;">Email</label>
                    <input type="email" id="email" required autocomplete="email" class="w-full p-2 rounded focus:outline-none" style="background:#1f2330; color:#f3f4f6; border:1px solid #374151;">
                </div>
                <div class="mb-4">
                    <label for="code" class="block text-sm font-bold mb-2" style="color:#d1d5db;">Verification Code</label>
                    <input type="text" id="code" required inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" class="w-full p-2 rounded focus:outline-none" style="background:#1f2330; color:#f3f4f6; border:1px solid #374151;">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-bold mb-2" style="color:#d1d5db;">New Password</label>
                    <input type="password" id="newPassword" required minlength="8" class="w-full p-2 rounded focus:outline-none" style="background:#1f2330; color:#f3f4f6; border:1px solid #374151;">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-bold mb-2" style="color:#d1d5db;">Confirm New Password</label>
                    <input type="password" id="confirmPassword" required minlength="8" class="w-full p-2 rounded focus:outline-none" style="background:#1f2330; color:#f3f4f6; border:1px solid #374151;">
                </div>
                <button type="submit" class="w-full text-white py-2 rounded" style="background:#7c3aed;" onmouseover="this.style.background='#6d28d9'" onmouseout="this.style.background='#7c3aed'">
                    Reset Password
                </button>
            </form>

            <p class="text-center mt-4 text-sm" style="color:#9ca3af;">
                <a href="/page/forgot-password" style="color:#a78bfa;" class="hover:underline">Request a new code</a> · <a href="/page/login" style="color:#a78bfa;" class="hover:underline">Back to login</a>
            </p>

            <div id="message" class="mt-4 text-sm text-center hidden"></div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('email').value = params.get('email') || '';
        const form = document.getElementById('resetForm');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const code = document.getElementById('code').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = e.target.querySelector('button[type="submit"]');

            messageDiv.classList.add('hidden');

            if (newPassword !== confirmPassword) {
                messageDiv.style.color = '#f87171';
                messageDiv.textContent = 'Passwords do not match.';
                messageDiv.classList.remove('hidden');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Resetting...';

            try {
                const response = await fetch('/api/v1/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, code, new_password: newPassword })
                });

                const data = await response.json();

                messageDiv.style.color = response.ok ? '#86efac' : '#f87171';
                messageDiv.textContent = data.message || data.error || 'Something went wrong.';
                messageDiv.classList.remove('hidden');

                if (response.ok) {
                    form.classList.add('hidden');
                    if (data.token) {
                        localStorage.setItem('token', data.token);
                        window.location.href = '/dashboard';
                    } else {
                        setTimeout(() => { window.location.href = '/page/login'; }, 2000);
                    }
                }
            } catch (err) {
                messageDiv.style.color = '#f87171';
                messageDiv.textContent = 'Network error. Please try again.';
                messageDiv.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Reset Password';
            }
        });
    </script>
</body>
</html>
