<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - L2EStudyLink</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/login.css">
    <link rel="stylesheet" href="/static/css/auth-polish.css">
</head>
<body>
    <div class="login-shell">
        <aside class="login-hero">
            <svg class="hero-network" viewBox="0 0 500 800" preserveAspectRatio="xMidYMid slice">
                <line x1="60" y1="120" x2="180" y2="220"></line>
                <line x1="180" y1="220" x2="120" y2="360"></line>
                <line x1="180" y1="220" x2="320" y2="180"></line>
                <line x1="320" y1="180" x2="420" y2="280"></line>
                <line x1="120" y1="360" x2="260" y2="420"></line>
                <line x1="260" y1="420" x2="320" y2="180"></line>
                <line x1="260" y1="420" x2="180" y2="560"></line>
                <line x1="180" y1="560" x2="340" y2="600"></line>
                <line x1="340" y1="600" x2="420" y2="280"></line>
                <line x1="60" y1="120" x2="320" y2="180"></line>
                <line x1="120" y1="360" x2="340" y2="600"></line>
                <circle cx="60" cy="120" r="4"></circle>
                <circle cx="180" cy="220" r="5" class="node-accent"></circle>
                <circle cx="120" cy="360" r="4"></circle>
                <circle cx="320" cy="180" r="4"></circle>
                <circle cx="420" cy="280" r="4"></circle>
                <circle cx="260" cy="420" r="5" class="node-accent"></circle>
                <circle cx="180" cy="560" r="4"></circle>
                <circle cx="340" cy="600" r="4"></circle>
            </svg>
            <div class="hero-content"><span class="hero-eyebrow">PEER LEARNING, REIMAGINED</span>
                <a class="hero-wordmark" href="/" aria-label="L2EStudyLink home">L2EStudyLink</a>
                <p class="hero-tagline">Where curious people find their people, share what they know, and grow together.</p>
            </div>
        </aside>
        <main class="login-panel"><a href="/page/login" class="mobile-auth-brand">L2E<span>Study</span>Link</a>
        <div class="login-card">
                <div class="login-icon-badge" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg></div>
                <h1 class="login-title">Reset Password</h1>
                <p class="login-subtitle">Enter the six-digit code sent to your email. It expires in 10 minutes.</p>
            <form id="resetForm">
                <label class="field-label" for="email">Email</label>
                <div class="input-group">
                    <span class="field-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg></span>
                    <input type="email" id="email" required autocomplete="email" placeholder="you@example.com">
                </div>
                <label class="field-label" for="code">Verification code</label>
                <div class="input-group">
                    <span class="field-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"></circle><path d="m10.8 12.2 9.2-9.2 2 2-2 2 1.5 1.5-2 2-1.5-1.5-5.2 5.2"></path></svg></span>
                    <input type="text" id="code" required inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit code">
                </div>
                <label class="field-label" for="newPassword">New password</label>
                <div class="input-group">
                    <span class="field-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span>
                    <input type="password" id="newPassword" required autocomplete="new-password" minlength="8" placeholder="At least 8 characters">
                </div>
                <label class="field-label" for="confirmPassword">Confirm new password</label>
                <div class="input-group">
                    <span class="field-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span>
                    <input type="password" id="confirmPassword" required autocomplete="new-password" minlength="8" placeholder="Repeat password">
                </div>
                <button type="submit" class="btn-primary">Reset Password</button>
            </form>
            <p class="signup-note"><a href="/page/forgot-password">Request a new code</a> · <a href="/page/login">Back to login</a></p>
            <div id="message" class="login-error hidden" role="status" aria-live="polite"></div>
        </div>
    </main>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('email').value = params.get('email') || '';
        const form = document.getElementById('resetForm');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const code = document.getElementById('code').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = e.target.querySelector('button[type="submit"]');

            messageDiv.classList.add('hidden');

            if (newPassword !== confirmPassword) {
                messageDiv.style.color = '#dc2626';
                messageDiv.textContent = 'Passwords do not match.';
                messageDiv.classList.remove('hidden');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Resetting...';

            try {
                const response = await fetch('/api/v1/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, code, new_password: newPassword })
                });

                const data = await response.json();

                messageDiv.style.color = response.ok ? '#15803d' : '#dc2626';
                messageDiv.textContent = data.message || data.error || 'Something went wrong.';
                messageDiv.classList.remove('hidden');

                if (response.ok) {
                    form.style.display = 'none';
                    if (data.user) {
                        localStorage.removeItem('token');
                        window.location.href = '/dashboard';
                    } else {
                        setTimeout(() => { window.location.href = '/page/login'; }, 2000);
                    }
                }
            } catch (err) {
                messageDiv.style.color = '#dc2626';
                messageDiv.textContent = 'Network error. Please try again.';
                messageDiv.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Reset Password';
            }
        });
    </script>
</body>
</html>
