<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="/static/manifest.webmanifest">
    <link rel="icon" href="/static/icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <meta name="theme-color" content="#172537">
    <script src="/static/js/pwa.js" defer></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - L2EStudyLink</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/login.css">
    <link rel="stylesheet" href="/static/css/auth-polish.css">
</head>
<body>
    <div class="login-shell">
        <aside class="login-hero">
            <svg class="hero-network" viewBox="0 0 500 800" preserveAspectRatio="xMidYMid slice">
                <line x1="60" y1="120" x2="180" y2="220"></line>
                <line x1="180" y1="220" x2="120" y2="360"></line>
                <line x1="180" y1="220" x2="320" y2="180"></line>
                <line x1="320" y1="180" x2="420" y2="280"></line>
                <line x1="120" y1="360" x2="260" y2="420"></line>
                <line x1="260" y1="420" x2="320" y2="180"></line>
                <line x1="260" y1="420" x2="180" y2="560"></line>
                <line x1="180" y1="560" x2="340" y2="600"></line>
                <line x1="340" y1="600" x2="420" y2="280"></line>
                <line x1="60" y1="120" x2="320" y2="180"></line>
                <line x1="120" y1="360" x2="340" y2="600"></line>
                <circle cx="60" cy="120" r="4"></circle>
                <circle cx="180" cy="220" r="5" class="node-accent"></circle>
                <circle cx="120" cy="360" r="4"></circle>
                <circle cx="320" cy="180" r="4"></circle>
                <circle cx="420" cy="280" r="4"></circle>
                <circle cx="260" cy="420" r="5" class="node-accent"></circle>
                <circle cx="180" cy="560" r="4"></circle>
                <circle cx="340" cy="600" r="4"></circle>
            </svg>
            <div class="hero-content"><span class="hero-eyebrow">PEER LEARNING, REIMAGINED</span>
                <a class="hero-wordmark" href="/" aria-label="L2EStudyLink home">L2EStudyLink</a>
                <p class="hero-tagline">Where curious people find their people, share what they know, and grow together.</p>
            </div>
        </aside>
        <main class="login-panel"><a href="/page/login" class="mobile-auth-brand">L2E<span>Study</span>Link</a>
            <div class="login-card">
                <div class="login-icon-badge" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21v-2a8 8 0 0 1 16 0v2"></path></svg></div>
                <h1 class="login-title">Create account</h1>
                <p class="login-subtitle">Join students and tutors learning together</p>
                <form id="signupForm">
                    <label class="field-label" for="name">Full name</label>
                    <div class="input-group">
                        <span class="field-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21v-2a8 8 0 0 1 16 0v2"></path></svg></span>
                        <input type="text" id="name" required autocomplete="name" placeholder="Your name">
                    </div>
                    <label class="field-label" for="email">Email</label>
                    <div class="input-group">
                        <span class="field-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg></span>
                        <input type="email" id="email" required autocomplete="email" placeholder="you@example.com">
                    </div>
                    <label class="field-label" for="password">Password</label>
                    <div class="input-group">
                        <span class="field-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span>
                        <input type="password" id="password" required autocomplete="new-password" minlength="6" placeholder="At least 6 characters">
                    </div>
                    <label class="product-email-choice"><input type="checkbox" id="productEmails"> Email me occasional product updates and goal-setting tips. Optional; I can turn this off later.</label>
                    <button type="submit" class="btn-primary">Sign up</button>
                </form>
                <p class="signup-note">Already have an account? <a href="/page/login">Log in</a></p>
                <div id="error" class="login-error hidden" role="alert"></div>
                <div id="success" class="login-error hidden" role="status" aria-live="polite" style="color:#15803d;"></div>
            </div>
        </main>
    </div>
    <script>
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const product_emails = document.getElementById('productEmails').checked;
            const errorDiv = document.getElementById('error');
            const successDiv = document.getElementById('success');

            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');

            try {
                const response = await fetch('/api/v1/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, product_emails })
                });

                const data = await response.json();

                if (response.ok) {
                    successDiv.textContent = 'Account created! Redirecting to login...';
                    successDiv.classList.remove('hidden');
                    setTimeout(() => {
                        window.location.href = '/page/login';
                    }, 2000);
                } else {
                    errorDiv.textContent = data.error || 'Signup failed';
                    errorDiv.classList.remove('hidden');
                }
            } catch(err) {
                errorDiv.textContent = 'Network error. Please try again.';
                errorDiv.classList.remove('hidden');
            }
        });

    </script>
</body>
</html>
