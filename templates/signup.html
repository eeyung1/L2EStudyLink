<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - L2EStudyLink</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
<script>
    // Dark mode: apply before paint to avoid flash
    // Defaults to dark unless the user has explicitly chosen light mode
    (function() {
        if (localStorage.getItem('darkMode') !== 'false') {
            document.documentElement.classList.add('dark');
        }
    })();
</script>
    <link rel="stylesheet" href="/static/css/dark-mode.css">
</head>
<body class="bg-gray-100">
    <div class="max-w-md mx-auto mt-20">
        <div class="bg-white rounded-lg shadow p-8">
            <h1 class="text-2xl font-bold text-center text-blue-600 mb-6">L2EStudyLink</h1>
            <h2 class="text-xl font-bold mb-6 text-center">Create Account</h2>
            
            <form id="signupForm">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Full Name</label>
                    <input type="text" id="name" required class="w-full p-2 border rounded focus:outline-none focus:border-blue-500">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                    <input type="email" id="email" required class="w-full p-2 border rounded focus:outline-none focus:border-blue-500">
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                    <input type="password" id="password" required minlength="6" class="w-full p-2 border rounded focus:outline-none focus:border-blue-500">
                    <p class="text-gray-500 text-xs mt-1">Minimum 6 characters</p>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Sign Up</button>
            </form>
            
            <p class="text-center text-gray-600 mt-4 text-sm">
                Already have an account? 
                <a href="/page/login" class="text-blue-600 hover:underline">Login</a>
            </p>
            
            <div id="error" class="mt-4 text-red-600 text-sm text-center hidden"></div>
            <div id="success" class="mt-4 text-green-600 text-sm text-center hidden"></div>
        </div>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            const successDiv = document.getElementById('success');
            
            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');
            
            try {
                const response = await fetch('/api/v1/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    successDiv.textContent = 'Account created! Redirecting to login...';
                    successDiv.classList.remove('hidden');
                    setTimeout(() => {
                        window.location.href = '/page/login';
                    }, 2000);
                } else {
                    errorDiv.textContent = data.error || 'Signup failed';
                    errorDiv.classList.remove('hidden');
                }
            } catch(err) {
                errorDiv.textContent = 'Network error. Please try again.';
                errorDiv.classList.remove('hidden');
            }
        });
    
        function toggleDark() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('darkMode', isDark);
            document.getElementById('darkToggle').textContent = isDark ? '☀️' : '🌙';
        }
        // Sync icon on load
        if (localStorage.getItem('darkMode') === 'true') {
            const btn = document.getElementById('darkToggle');
            if (btn) btn.textContent = '☀️';
        }

    </script>
</body>
</html>
