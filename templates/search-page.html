<!DOCTYPE html>
<html>
<head>
    <title>Find Tutors - L2EStudyLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <h1 class="text-xl font-bold text-blue-600">L2EStudyLink</h1>
                </div>
                <div class="flex space-x-4">
                    <a href="/dashboard" class="text-gray-700 hover:text-blue-600">Dashboard</a>
                    <a href="/search-page" class="text-gray-700 hover:text-blue-600">Find Tutors</a>
                    <a href="/my-bookings" class="text-gray-700 hover:text-blue-600">My Bookings</a>
                    <div id="adminNavLink" class="hidden">
                        <a href="/admin" class="text-gray-700 hover:text-blue-600">Admin</a>
                    </div>
                    <button onclick="logout()" class="text-red-600 hover:text-red-800">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-2xl font-bold mb-4">Find a Tutor</h2>
            <div class="flex gap-2 mb-6">
                <input type="text" id="skillSearch" placeholder="Search by skill (e.g., Go, Python)" class="flex-1 p-2 border rounded">
                <button onclick="searchTutors()" class="bg-blue-600 text-white px-6 py-2 rounded">Search</button>
            </div>
            <div id="searchResults"></div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/page/login';
        }
        
        fetch('/api/v1/me', {
            headers: { 'Authorization': `Bearer ${token}` }
        }).then(r => r.json()).then(user => {
            if (user.is_admin) {
                document.getElementById('adminNavLink').classList.remove('hidden');
            }
        });
        
        async function logout() {
            localStorage.removeItem('token');
            window.location.href = '/page/login';
        }
        
        async function searchTutors() {
            const skill = document.getElementById('skillSearch').value;
            if (!skill) {
                alert('Please enter a skill to search');
                return;
            }
            
            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = '<div class="text-center text-gray-500">Searching...</div>';
            
            try {
                const res = await fetch(`/api/v1/search?skill=${encodeURIComponent(skill)}`);
                
                if (!res.ok) {
                    const error = await res.json();
                    resultsDiv.innerHTML = '<div class="text-center text-red-600">Search error: ' + (error.error || 'Unknown') + '</div>';
                    return;
                }
                
                const tutors = await res.json();
                
                if (!tutors || tutors.length === 0) {
                    resultsDiv.innerHTML = '<div class="text-center text-gray-500">No tutors found for "' + skill + '"</div>';
                    return;
                }
                
                let html = '';
                for (let i = 0; i < tutors.length; i++) {
                    const t = tutors[i];
                    html += `
                        <div class="border rounded-lg p-4 mb-3 hover:shadow">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="font-bold text-lg">${escapeHtml(t.name)}</h3>
                                    <p class="text-gray-600 text-sm">⭐ ${t.rating} (${t.total_reviews} reviews)</p>
                                    <p class="text-gray-700 mt-2">${escapeHtml(t.bio) || 'No bio yet'}</p>
                                </div>
                                <button onclick="alert('View profile feature coming soon')" class="bg-blue-600 text-white px-4 py-2 rounded text-sm">View Profile</button>
                            </div>
                        </div>
                    `;
                }
                resultsDiv.innerHTML = html;
            } catch(e) {
                resultsDiv.innerHTML = '<div class="text-center text-red-600">Search failed: ' + e.message + '</div>';
                console.error(e);
            }
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        document.getElementById('skillSearch').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchTutors();
            }
        });
    </script>
</body>
</html>
