<!DOCTYPE html>
<html>
<head>
    <title>Find Tutors - L2EStudyLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <h1 class="text-xl font-bold text-blue-600">L2EStudyLink</h1>
                </div>
                <div class="flex space-x-4">
                    <a href="/dashboard" class="text-gray-700 hover:text-blue-600">Dashboard</a>
                    <a href="/search-page" class="text-gray-700 hover:text-blue-600">Find Tutors</a>
                    <a href="/my-bookings" class="text-gray-700 hover:text-blue-600">My Bookings</a>
                    <div id="adminNavLink" class="hidden">
                        <a href="/admin" class="text-gray-700 hover:text-blue-600">Admin</a>
                    </div>
                    <button onclick="logout()" class="text-red-600 hover:text-red-800">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-2xl font-bold mb-4">Find a Tutor</h2>
            <div class="flex gap-2 mb-6">
                <input type="text" id="skillSearch" placeholder="Search by skill (e.g., Go, Python)" class="flex-1 p-2 border rounded">
                <button onclick="searchTutors()" class="bg-blue-600 text-white px-6 py-2 rounded">Search</button>
            </div>
            <div id="searchResults"></div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/page/login';
        }
        
        let currentTutor = null;
        
        function formatTime(timeStr) {
            if (!timeStr) return '';
            if (timeStr.includes('T')) {
                return timeStr.split('T')[1].split('.')[0].substring(0, 5);
            }
            return timeStr.substring(0, 5);
        }
        
        fetch('/api/v1/me', {
            headers: { 'Authorization': `Bearer ${token}` }
        }).then(r => r.json()).then(user => {
            if (user.is_admin) {
                document.getElementById('adminNavLink').classList.remove('hidden');
            }
        });
        
        async function logout() {
            localStorage.removeItem('token');
            window.location.href = '/page/login';
        }
        
        async function searchTutors() {
            const skill = document.getElementById('skillSearch').value;
            if (!skill) {
                alert('Please enter a skill to search');
                return;
            }
            
            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = '<div class="text-center text-gray-500">Searching...</div>';
            
            try {
                const res = await fetch(`/api/v1/search?skill=${encodeURIComponent(skill)}`);
                const tutors = await res.json();
                
                if (!tutors || tutors.length === 0) {
                    resultsDiv.innerHTML = '<div class="text-center text-gray-500">No tutors found for "' + skill + '"</div>';
                    return;
                }
                
                let html = '';
                for (const t of tutors) {
                    html += `
                        <div class="border rounded-lg p-4 mb-3 hover:shadow">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="font-bold text-lg">${escapeHtml(t.name)}</h3>
                                    <p class="text-gray-600 text-sm">⭐ ${t.rating} (${t.total_reviews} reviews)</p>
                                    <p class="text-gray-700 mt-2">${escapeHtml(t.bio) || 'No bio yet'}</p>
                                </div>
                                <button onclick="viewTutor(${t.id})" class="bg-blue-600 text-white px-4 py-2 rounded text-sm">View & Book</button>
                            </div>
                        </div>
                    `;
                }
                resultsDiv.innerHTML = html;
            } catch(e) {
                resultsDiv.innerHTML = '<div class="text-center text-red-600">Search failed. Please try again.</div>';
            }
        }
        
        async function viewTutor(id) {
            try {
                const res = await fetch(`/api/v1/tutors/${id}`);
                const tutor = await res.json();
                currentTutor = tutor;
                
                const modalHtml = `
                    <div id="tutorModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                        <div class="bg-white rounded-lg p-6 max-w-2xl w-full max-h-screen overflow-y-auto m-4">
                            <div class="flex justify-between items-start mb-4">
                                <h2 class="text-2xl font-bold">${escapeHtml(tutor.name)}</h2>
                                <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
                            </div>
                            <div>
                                <p><strong>Email:</strong> ${escapeHtml(tutor.email)}</p>
                                <p><strong>Discord:</strong> ${escapeHtml(tutor.discord_username) || 'Not set'}</p>
                                <p><strong>Bio:</strong> ${escapeHtml(tutor.bio) || 'No bio'}</p>
                                <p><strong>Rating:</strong> ⭐ ${tutor.rating} (${tutor.total_reviews} reviews)</p>
                                <p><strong>Skills:</strong> ${tutor.skills?.map(s => `${s.name} (${s.proficiency})`).join(', ') || 'None'}</p>
                            </div>
                            <div class="mt-4 pt-4 border-t">
                                <h3 class="font-bold mb-2">Availability</h3>
                                <div id="availabilityList"></div>
                                <div id="bookingSection"></div>
                            </div>
                        </div>
                    </div>
                `;
                
                document.body.insertAdjacentHTML('beforeend', modalHtml);
                
                const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
                let availHtml = '';
                if (tutor.availability && tutor.availability.length > 0) {
                    for (const a of tutor.availability) {
                        availHtml += `<div class="bg-gray-100 p-2 rounded mb-2">${days[a.day_of_week]}: ${formatTime(a.start_time)} - ${formatTime(a.end_time)}</div>`;
                    }
                    document.getElementById('availabilityList').innerHTML = availHtml;
                    document.getElementById('bookingSection').innerHTML = \`
                        <button onclick="showBookingForm()" class="bg-green-600 text-white px-6 py-2 rounded w-full mt-4">Book a Session</button>
                    \`;
                } else {
                    document.getElementById('availabilityList').innerHTML = '<div class="text-gray-500">No availability set yet</div>';
                    document.getElementById('bookingSection').innerHTML = '<div class="text-gray-500 mt-4">Cannot book - tutor has no availability set</div>';
                }
            } catch(e) {
                alert('Failed to load tutor profile');
            }
        }
        
        function showBookingForm() {
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            const defaultDate = tomorrow.toISOString().split('T')[0];
            
            let timeOptions = '';
            for (const a of currentTutor.availability) {
                timeOptions += `<option value="${formatTime(a.start_time)}-${formatTime(a.end_time)}">${formatTime(a.start_time)} - ${formatTime(a.end_time)}</option>`;
            }
            
            document.getElementById('bookingSection').innerHTML = \`
                <div class="border-t pt-4 mt-2">
                    <h3 class="font-bold mb-2">Book a Session</h3>
                    <div class="mb-2">
                        <label class="block text-sm font-bold mb-1">Date</label>
                        <input type="date" id="bookDate" value="\${defaultDate}" class="w-full p-2 border rounded">
                    </div>
                    <div class="mb-2">
                        <label class="block text-sm font-bold mb-1">Time Slot</label>
                        <select id="bookTime" class="w-full p-2 border rounded">
                            \${timeOptions}
                        </select>
                    </div>
                    <div class="mb-2">
                        <label class="block text-sm font-bold mb-1">What do you need help with?</label>
                        <textarea id="bookTopic" rows="2" class="w-full p-2 border rounded" placeholder="Describe what you want to learn..."></textarea>
                    </div>
                    <div class="mb-2">
                        <label class="block text-sm font-bold mb-1">Meeting Type</label>
                        <select id="meetingType" class="w-full p-2 border rounded">
                            <option value="online">Online (Discord)</option>
                            <option value="in_person">In Person</option>
                        </select>
                    </div>
                    <button onclick="createBooking()" class="bg-blue-600 text-white px-4 py-2 rounded w-full mt-2">Confirm Booking</button>
                    <button onclick="closeModal()" class="text-gray-500 text-sm mt-2 w-full">Cancel</button>
                </div>
            \`;
        }
        
        async function createBooking() {
            const date = document.getElementById('bookDate').value;
            const timeRange = document.getElementById('bookTime').value;
            const [startTime, endTime] = timeRange.split('-');
            const topic = document.getElementById('bookTopic').value || 'Study session';
            const meetingType = document.getElementById('meetingType').value;
            
            try {
                const res = await fetch('/api/v1/bookings', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        tutor_id: currentTutor.id,
                        date: date,
                        start_time: startTime,
                        end_time: endTime,
                        topic: topic,
                        meeting_type: meetingType
                    })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    alert('Booking created successfully!');
                    closeModal();
                } else {
                    alert('Booking failed: ' + (data.error || 'Unknown error'));
                }
            } catch(e) {
                alert('Booking failed: ' + e.message);
            }
        }
        
        function closeModal() {
            const modal = document.getElementById('tutorModal');
            if (modal) modal.remove();
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        document.getElementById('skillSearch').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchTutors();
            }
        });
    </script>
</body>
</html>
