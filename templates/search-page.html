<!DOCTYPE html>
<html>
<head>
    <title>Find Tutors - L2EStudyLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <h1 class="text-xl font-bold text-blue-600">L2EStudyLink</h1>
                <div class="flex space-x-4">
                    <a href="/dashboard" class="text-gray-700 hover:text-blue-600">Dashboard</a>
                    <a href="/search-page" class="text-gray-700 hover:text-blue-600">Find Tutors</a>
                    <a href="/my-bookings" class="text-gray-700 hover:text-blue-600">My Bookings</a>
                    <button onclick="logout()" class="text-red-600 hover:text-red-800">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-2xl font-bold mb-4">Find a Tutor</h2>
            <div class="flex gap-2 mb-6">
                <input type="text" id="searchSkill" placeholder="Skill (e.g., Go, Python)" class="flex-1 p-2 border rounded">
                <button onclick="searchTutors()" class="bg-blue-600 text-white px-6 py-2 rounded">Search</button>
            </div>
            <div id="searchResults"></div>
        </div>
    </div>

    <!-- Modal for tutor details and booking -->
    <div id="tutorModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 max-w-md w-full">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="text-xl font-bold">Tutor Details</h3>
                <button onclick="closeModal()" class="text-gray-500 text-2xl">&times;</button>
            </div>
            <div id="modalContent"></div>
            <div class="mt-4">
                <label class="block font-bold mb-1">Select Time Slot</label>
                <select id="timeSlot" class="w-full p-2 border rounded mb-3"></select>
                <label class="block font-bold mb-1">Topic</label>
                <input type="text" id="topic" placeholder="What do you need help with?" class="w-full p-2 border rounded mb-3">
                <button onclick="confirmBooking()" class="w-full bg-green-600 text-white py-2 rounded">Confirm Booking</button>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/page/login';
        
        let currentTutor = null;
        
        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/page/login';
        }
        
        function formatTime(timeStr) {
            if (!timeStr) return '';
            if (timeStr.includes('T')) {
                return timeStr.split('T')[1].split('.')[0].substring(0, 5);
            }
            return timeStr;
        }
        
        async function searchTutors() {
            const skill = document.getElementById('searchSkill').value;
            if (!skill) return;
            
            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = '<div class="text-center text-gray-500">Searching...</div>';
            
            try {
                const response = await fetch(`/api/v1/search?skill=${encodeURIComponent(skill)}`);
                const tutors = await response.json();
                
                if (!tutors || tutors.length === 0) {
                    resultsDiv.innerHTML = '<div class="text-center text-gray-500">No tutors found for "' + skill + '"</div>';
                    return;
                }
                
                let html = '';
                for (let i = 0; i < tutors.length; i++) {
                    const t = tutors[i];
                    html += `
                        <div class="border rounded-lg p-4 mb-3">
                            <h3 class="font-bold text-lg">${escapeHtml(t.name)}</h3>
                            <p>⭐ ${t.rating} (${t.total_reviews} reviews)</p>
                            <p class="text-gray-600">${escapeHtml(t.bio) || 'No bio'}</p>
                            <button onclick="viewTutor(${t.id})" class="mt-2 bg-blue-600 text-white px-4 py-1 rounded text-sm">View Availability & Book</button>
                        </div>
                    `;
                }
                resultsDiv.innerHTML = html;
            } catch(e) {
                resultsDiv.innerHTML = '<div class="text-center text-red-600">Search failed</div>';
            }
        }
        
        async function viewTutor(tutorId) {
            try {
                const response = await fetch(`/api/v1/tutors/${tutorId}`);
                const tutor = await response.json();
                currentTutor = tutor;
                
                const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
                
                let availabilityHtml = '<div class="mb-3">';
                if (tutor.availability && tutor.availability.length > 0) {
                    availabilityHtml += '<p class="font-bold">Available Times:</p><ul class="list-disc pl-5">';
                    for (const a of tutor.availability) {
                        availabilityHtml += `<li>${days[a.day_of_week]}: ${formatTime(a.start_time)} - ${formatTime(a.end_time)}</li>`;
                    }
                    availabilityHtml += '</ul>';
                } else {
                    availabilityHtml += '<p class="text-red-500">No availability set yet</p>';
                }
                availabilityHtml += '</div>';
                
                document.getElementById('modalTitle').innerHTML = tutor.name;
                document.getElementById('modalContent').innerHTML = `
                    <p><strong>Email:</strong> ${escapeHtml(tutor.email)}</p>
                    <p><strong>Discord:</strong> ${escapeHtml(tutor.discord_username) || 'Not set'}</p>
                    <p><strong>Bio:</strong> ${escapeHtml(tutor.bio) || 'No bio'}</p>
                    ${availabilityHtml}
                `;
                
                // Populate time slots
                const timeSlot = document.getElementById('timeSlot');
                timeSlot.innerHTML = '';
                if (tutor.availability && tutor.availability.length > 0) {
                    for (const a of tutor.availability) {
                        const option = document.createElement('option');
                        option.value = `${formatTime(a.start_time)}-${formatTime(a.end_time)}`;
                        option.text = `${days[a.day_of_week]}: ${formatTime(a.start_time)} - ${formatTime(a.end_time)}`;
                        timeSlot.appendChild(option);
                    }
                } else {
                    const option = document.createElement('option');
                    option.text = 'No availability';
                    option.disabled = true;
                    timeSlot.appendChild(option);
                }
                
                document.getElementById('topic').value = '';
                document.getElementById('tutorModal').classList.remove('hidden');
                document.getElementById('tutorModal').classList.add('flex');
            } catch(e) {
                alert('Error loading tutor: ' + e.message);
            }
        }
        
        async function confirmBooking() {
            const timeRange = document.getElementById('timeSlot').value;
            if (!timeRange || timeRange === 'No availability') {
                alert('No available time slots');
                return;
            }
            
            const [startTime, endTime] = timeRange.split('-');
            const topic = document.getElementById('topic').value;
            if (!topic) {
                alert('Please enter what you need help with');
                return;
            }
            
            const date = new Date();
            date.setDate(date.getDate() + 1);
            const bookingDate = date.toISOString().split('T')[0];
            
            try {
                const res = await fetch('/api/v1/bookings', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({
                        tutor_id: currentTutor.id,
                        date: bookingDate,
                        start_time: startTime,
                        end_time: endTime,
                        topic: topic,
                        meeting_type: 'online'
                    })
                });
                
                const data = await res.json();
                if (res.ok) {
                    alert('Booking confirmed for ' + bookingDate + ' at ' + startTime);
                    closeModal();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch(e) {
                alert('Error: ' + e.message);
            }
        }
        
        function closeModal() {
            document.getElementById('tutorModal').classList.add('hidden');
            document.getElementById('tutorModal').classList.remove('flex');
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        document.getElementById('searchSkill').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchTutors();
        });
    </script>
</body>
</html>
