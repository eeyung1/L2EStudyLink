<!DOCTYPE html>
<html>
<head>
    <title>Find Tutors - L2EStudyLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <h1 class="text-xl font-bold text-blue-600">L2EStudyLink</h1>
                <div class="flex space-x-4">
                    <a href="/dashboard" class="text-gray-700">Dashboard</a>
                    <a href="/search-page" class="text-gray-700">Find Tutors</a>
                    <a href="/my-bookings" class="text-gray-700">My Bookings</a>
                    <button onclick="logout()" class="text-red-600">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-2xl font-bold mb-4">Find a Tutor</h2>
            <div class="flex gap-2 mb-6">
                <input type="text" id="skill" placeholder="Search by skill (Go, Python)" class="flex-1 p-2 border rounded">
                <button onclick="doSearch()" class="bg-blue-600 text-white px-6 py-2 rounded">Search</button>
            </div>
            <div id="results"></div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/page/login';
        }
        
        async function logout() {
            localStorage.removeItem('token');
            window.location.href = '/page/login';
        }
        
        async function doSearch() {
            const skill = document.getElementById('skill').value;
            if (!skill) return;
            
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="text-center">Searching...</div>';
            
            try {
                const res = await fetch('/api/v1/search?skill=' + encodeURIComponent(skill));
                const tutors = await res.json();
                
                if (!tutors || tutors.length === 0) {
                    resultsDiv.innerHTML = '<div class="text-center text-gray-500">No tutors found</div>';
                    return;
                }
                
                let html = '';
                for (let i = 0; i < tutors.length; i++) {
                    const t = tutors[i];
                    html += '<div class="border rounded p-4 mb-3">';
                    html += '<h3 class="font-bold">' + t.name + '</h3>';
                    html += '<p class="text-gray-600">⭐ ' + t.rating + ' (' + t.total_reviews + ' reviews)</p>';
                    html += '<p class="text-gray-700">' + (t.bio || 'No bio') + '</p>';
                    html += '<button onclick="bookTutor(' + t.id + ')" class="mt-2 bg-blue-600 text-white px-4 py-1 rounded text-sm">Book Session</button>';
                    html += '</div>';
                }
                resultsDiv.innerHTML = html;
            } catch(e) {
                resultsDiv.innerHTML = '<div class="text-center text-red-600">Search failed</div>';
            }
        }
        
        async function bookTutor(tutorId) {
            const date = prompt('Enter date (YYYY-MM-DD):', '2026-04-27');
            const time = prompt('Enter time (HH:MM, e.g., 14:00):', '14:00');
            const topic = prompt('What do you need help with?', 'Study session');
            
            if (!date || !time) return;
            
            const endHour = parseInt(time.split(':')[0]) + 1;
            const endTime = endHour + ':00';
            
            try {
                const res = await fetch('/api/v1/bookings', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({
                        tutor_id: tutorId,
                        date: date,
                        start_time: time,
                        end_time: endTime,
                        topic: topic,
                        meeting_type: 'online'
                    })
                });
                
                const data = await res.json();
                if (res.ok) {
                    alert('Booking created! Check My Bookings.');
                } else {
                    alert('Booking failed: ' + data.error);
                }
            } catch(e) {
                alert('Error: ' + e.message);
            }
        }
    </script>
</body>
</html>
