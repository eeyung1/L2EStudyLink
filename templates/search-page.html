<!DOCTYPE html>
<html>
<head>
    <title>Find Study Partners - L2EStudyLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <h1 class="text-xl font-bold text-blue-600">L2EStudyLink</h1>
                <div class="flex space-x-4">
                    <a href="/dashboard" class="text-gray-700 hover:text-blue-600">Dashboard</a>
                    <a href="/search-page" class="text-gray-700 hover:text-blue-600">Find Study Partners</a>
                    <a href="/my-bookings" class="text-gray-700 hover:text-blue-600">My Study Sessions</a>
                    <div id="adminNavLink" class="hidden">
                        <a href="/admin" class="text-gray-700 hover:text-blue-600">Admin</a>
                    </div>
                    <button onclick="logout()" class="text-red-600 hover:text-red-800">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-2xl font-bold mb-4">Find Study Partners</h2>
            
            <!-- Search Filters -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-6">
                <input type="text" id="skillSearch" placeholder="Skill (e.g., Go, Python)" class="p-2 border rounded">
                <input type="date" id="dateSearch" class="p-2 border rounded">
                <button onclick="searchTutors()" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">Search</button>
            </div>
            
            <div id="searchResults"></div>
        </div>
    </div>

    <div id="tutorModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 max-w-md w-full">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="text-xl font-bold">Tutor Details</h3>
                <button onclick="closeModal()" class="text-gray-500 text-2xl">&times;</button>
            </div>
            <div id="modalContent"></div>
            <div class="mt-4">
                <label class="block font-bold mb-1">Select Date</label>
                <input type="date" id="bookingDate" class="w-full p-2 border rounded mb-3">
                <label class="block font-bold mb-1">Select Time Slot</label>
                <select id="timeSlot" class="w-full p-2 border rounded mb-3"></select>
                <label class="block font-bold mb-1">Topic</label>
                <input type="text" id="topic" placeholder="What do you need help with?" class="w-full p-2 border rounded mb-3">
                <button onclick="confirmBooking()" class="w-full bg-green-600 text-white py-2 rounded">Confirm Booking</button>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/page/login';
        }
        
        let currentTutor = null;
        let currentAvailability = [];
        
        // Set default date to today
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        const todayDate = `${year}-${month}-${day}`;
        
        // Set default date in search field
        document.getElementById('dateSearch').value = todayDate;
        
        fetch('/api/v1/me', {
            headers: { 'Authorization': `Bearer ${token}` }
        }).then(r => r.json()).then(user => {
            if (user.is_admin) {
                document.getElementById('adminNavLink').classList.remove('hidden');
            }
        });
        
        async function logout() {
            localStorage.removeItem('token');
            window.location.href = '/page/login';
        }
        
        function formatTimeForDisplay(timeStr) {
            if (!timeStr) return '';
            if (timeStr.includes('T')) {
                const parts = timeStr.split('T');
                if (parts.length > 1) {
                    const timePart = parts[1].split('Z')[0];
                    return convertTo12Hour(timePart.substring(0, 5));
                }
            }
            return convertTo12Hour(timeStr.substring(0, 5));
        }
        
        function convertTo12Hour(time24) {
            const [hours, minutes] = time24.split(':');
            const hour = parseInt(hours);
            const ampm = hour >= 12 ? 'PM' : 'AM';
            const hour12 = hour % 12 || 12;
            return `${hour12}:${minutes} ${ampm}`;
        }
        
        function getDayOfWeekFromDate(dateString) {
            const date = new Date(dateString);
            return date.getDay(); // 0 = Sunday, 1 = Monday, etc.
        }
        
        // Cache tutors returned by the last search so viewTutor() doesn't need
        // another network request — availability is already in the payload.
        let cachedTutors = {};

        async function searchTutors() {
            const skill = document.getElementById('skillSearch').value;
            const selectedDate = document.getElementById('dateSearch').value;
            
            if (!skill) {
                alert('Please enter a skill to search');
                return;
            }
            
            if (!selectedDate) {
                alert('Please select a date');
                return;
            }
            
            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = '<div class="text-center text-gray-500">Searching...</div>';
            
            try {
                // ONE request — tutors + their full availability in a single JOIN query.
                const res = await fetch(`/api/v1/search-with-availability?skill=${encodeURIComponent(skill)}`);
                const tutors = await res.json();
                
                if (!tutors || tutors.length === 0) {
                    resultsDiv.innerHTML = '<div class="text-center text-gray-500">No tutors found for "' + skill + '"</div>';
                    return;
                }

                // Convert JS Date.getDay() (0=Sun) → our DB format (0=Mon … 6=Sun)
                let selectedDay = getDayOfWeekFromDate(selectedDate);
                selectedDay = selectedDay === 0 ? 6 : selectedDay - 1;
                
                // Filter entirely in the browser — no extra requests needed
                cachedTutors = {};
                const filteredTutors = tutors.filter(t => {
                    cachedTutors[t.id] = t; // cache while we iterate
                    return t.availability && t.availability.some(slot => slot.day_of_week === selectedDay);
                });
                
                if (filteredTutors.length === 0) {
                    const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
                    resultsDiv.innerHTML = `<div class="text-center text-gray-500">No tutors available on ${days[selectedDay]} who can teach "${skill}"</div>`;
                    return;
                }
                
                let html = '';
                for (const t of filteredTutors) {
                    html += `
                        <div class="border rounded-lg p-4 mb-3 hover:shadow">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="font-bold text-lg">${escapeHtml(t.name)}</h3>
                                    <p>⭐ ${t.rating} (${t.total_reviews} reviews)</p>
                                    <p class="text-gray-600">${escapeHtml(t.bio) || 'No bio'}</p>
                                </div>
                                <button onclick="viewTutor(${t.id}, '${selectedDate}')" class="bg-blue-600 text-white px-4 py-2 rounded text-sm">View & Book</button>
                            </div>
                        </div>
                    `;
                }
                resultsDiv.innerHTML = html;
            } catch(e) {
                resultsDiv.innerHTML = '<div class="text-center text-red-600">Search failed: ' + e.message + '</div>';
            }
        }
        
        async function viewTutor(tutorId, selectedDate) {
            try {
                // Use cached data from the search if available; fall back to API only
                // when the modal is opened directly (e.g. page refresh edge-case).
                let tutor = cachedTutors[tutorId];
                if (!tutor) {
                    const res = await fetch(`/api/v1/tutors/${tutorId}`);
                    tutor = await res.json();
                }
                currentTutor = tutor;
                currentAvailability = tutor.availability || [];
                
                // Get day of week from selected date
                let selectedDay = getDayOfWeekFromDate(selectedDate);
                if (selectedDay === 0) {
                    selectedDay = 6;
                } else {
                    selectedDay = selectedDay - 1;
                }
                
                const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
                
                // Filter availability for the selected day only
                const dayAvailability = currentAvailability.filter(a => a.day_of_week === selectedDay);
                
                let availabilityHtml = '<div class="mb-3">';
                if (dayAvailability.length > 0) {
                    availabilityHtml += `<p class="font-bold">Available on ${days[selectedDay]}:</p><ul class="list-disc pl-5">`;
                    for (const a of dayAvailability) {
                        availabilityHtml += `<li>${formatTimeForDisplay(a.start_time)} - ${formatTimeForDisplay(a.end_time)}</li>`;
                    }
                    availabilityHtml += '</ul>';
                } else {
                    availabilityHtml += `<p class="text-red-500">No availability on ${days[selectedDay]}</p>`;
                }
                availabilityHtml += '</div>';
                
                document.getElementById('modalTitle').innerHTML = tutor.name;
                document.getElementById('modalContent').innerHTML = `
                    <p><strong>Email:</strong> ${escapeHtml(tutor.email)}</p>
                    <p><strong>Discord:</strong> ${escapeHtml(tutor.discord_username) || 'Not set'}</p>
                    <p><strong>Bio:</strong> ${escapeHtml(tutor.bio) || 'No bio'}</p>
                    ${availabilityHtml}
                `;
                
                // Set date picker to selected date
                const dateInput = document.getElementById('bookingDate');
                dateInput.value = selectedDate;
                dateInput.min = todayDate;
                
                // Populate time slots for selected day only
                const timeSlot = document.getElementById('timeSlot');
                timeSlot.innerHTML = '';
                if (dayAvailability.length > 0) {
                    for (let i = 0; i < dayAvailability.length; i++) {
                        const a = dayAvailability[i];
                        const option = document.createElement('option');
                        option.value = `${a.start_time}|${a.end_time}`;
                        option.text = `${formatTimeForDisplay(a.start_time)} - ${formatTimeForDisplay(a.end_time)}`;
                        timeSlot.appendChild(option);
                    }
                } else {
                    const option = document.createElement('option');
                    option.text = 'No availability';
                    option.disabled = true;
                    timeSlot.appendChild(option);
                }
                
                document.getElementById('topic').value = '';
                document.getElementById('tutorModal').classList.remove('hidden');
                document.getElementById('tutorModal').classList.add('flex');
            } catch(e) {
                alert('Error loading tutor: ' + e.message);
            }
        }
        
        async function confirmBooking() {
            const timeSlotValue = document.getElementById('timeSlot').value;
            if (!timeSlotValue || timeSlotValue === 'No availability') {
                alert('Please select a valid time slot');
                return;
            }
            
            const [startTime, endTime] = timeSlotValue.split('|');
            const date = document.getElementById('bookingDate').value;
            if (!date) {
                alert('Please select a date');
                return;
            }
            
            const topic = document.getElementById('topic').value;
            if (!topic) {
                alert('Please enter what you need help with');
                return;
            }
            
            const meetingType = confirm('Online session? (OK = Online, Cancel = In Person)') ? 'online' : 'in_person';
            
            try {
                const res = await fetch('/api/v1/bookings', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({
                        tutor_id: currentTutor.id,
                        date: date,
                        start_time: startTime,
                        end_time: endTime,
                        topic: topic,
                        meeting_type: meetingType
                    })
                });
                
                const data = await res.json();
                if (res.ok) {
                    alert('Booking confirmed for ' + date + ' at ' + formatTimeForDisplay(startTime));
                    closeModal();
                    window.location.href = '/my-bookings';
                } else {
                    alert('Error: ' + data.error);
                }
            } catch(e) {
                alert('Error: ' + e.message);
            }
        }
        
        function closeModal() {
            document.getElementById('tutorModal').classList.add('hidden');
            document.getElementById('tutorModal').classList.remove('flex');
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        document.getElementById('skillSearch').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchTutors();
            }
        });
    </script>
</body>
</html>
