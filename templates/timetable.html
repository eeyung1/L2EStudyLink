<!DOCTYPE html>
<html>
<head>
    <title>My Timetable - L2EStudyLink</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
<script>
    // Dark mode: apply before paint to avoid flash
    // Defaults to dark unless the user has explicitly chosen light mode
    (function() {
        if (localStorage.getItem('darkMode') !== 'false') {
            document.documentElement.classList.add('dark');
        }
    })();
</script>
    <link rel="stylesheet" href="/static/css/dark-mode.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body class="bg-gray-100">
    <div class="app-shell">
        <aside class="sidebar">
            <p class="sidebar-brand">L2E<span>Study</span>Link</p>

            <nav class="sidebar-nav">
                <a href="/dashboard" class="sidebar-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>
                    Dashboard
                </a>
                <a href="/search-page" class="sidebar-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
                    Find Study Partners
                </a>
                <a href="/my-bookings" class="sidebar-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path><path d="m9 15 2 2 4-4"></path></svg>
                    My Study Sessions
                </a>
                <a href="/timetable" class="sidebar-link active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path></svg>
                    Timetable
                </a>
                <a href="/reflections" class="sidebar-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"></path></svg>
                    Reflections
                </a>
                <div id="adminNavLink" class="hidden">
                    <a href="/admin" class="sidebar-link">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V5l-8-3Z"></path></svg>
                        Admin
                    </a>
                </div>
            </nav>

            <div class="sidebar-foot">
                <button class="logout-link" onclick="logout()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>
                    Logout
                </button>
                <button id="darkToggle" class="icon-btn" onclick="toggleDark()" title="Toggle dark mode">🌙</button>
            </div>
        </aside>

        <main class="main-content">
    <div class="max-w-7xl mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-2xl font-bold mb-4">My Weekly Timetable</h2>
            <p class="text-gray-600 mb-4">Plan your week, then add reflections after each time block.</p>
            
            <button onclick="showAddBlock()" class="bg-green-600 text-white px-4 py-2 rounded mb-6">+ Add Time Block</button>
            
            <div id="timetable">Loading...</div>
        </div>
    </div>
        </main>
    </div>

    <div id="addModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 max-w-md w-full">
            <h3 class="text-xl font-bold mb-4">Add Time Block</h3>

            <label class="block text-sm font-medium mb-2 text-gray-700">Repeat on</label>
            <div id="dayPicker" class="day-picker mb-1">
                <button type="button" class="day-chip" data-day="0">Mon</button>
                <button type="button" class="day-chip" data-day="1">Tue</button>
                <button type="button" class="day-chip" data-day="2">Wed</button>
                <button type="button" class="day-chip" data-day="3">Thu</button>
                <button type="button" class="day-chip" data-day="4">Fri</button>
                <button type="button" class="day-chip" data-day="5">Sat</button>
                <button type="button" class="day-chip" data-day="6">Sun</button>
            </div>
            <p class="text-xs text-gray-500 mb-3">Select one day, or several to add the same block to each at once.</p>

            <input type="time" id="blockStart" class="w-full p-2 border rounded mb-3" step="60" value="09:00">
            <input type="time" id="blockEnd" class="w-full p-2 border rounded mb-3" step="60" value="10:00">
            <input type="text" id="blockActivity" placeholder="Activity" class="w-full p-2 border rounded mb-3">
            <textarea id="blockGoal" rows="2" placeholder="Goal (optional)" class="w-full p-2 border rounded mb-3"></textarea>
            <button onclick="saveTimeBlock()" class="bg-blue-600 text-white px-4 py-2 rounded w-full">Save</button>
            <button onclick="closeAddModal()" class="bg-gray-300 text-gray-700 px-4 py-2 rounded w-full mt-2">Cancel</button>
        </div>
    </div>

    <div id="reflectionModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 max-w-md w-full">
            <h3 id="reflectionTitle" class="text-xl font-bold mb-4">Add Reflection</h3>
            <p id="reflectionDate" class="text-sm text-gray-600 mb-3"></p>
            <textarea id="reflectionSummary" rows="3" placeholder="What did you actually do?" class="w-full p-2 border rounded mb-3"></textarea>
            <textarea id="reflectionChallenges" rows="2" placeholder="Challenges faced?" class="w-full p-2 border rounded mb-3"></textarea>
            <textarea id="reflectionLearnings" rows="2" placeholder="What did you learn?" class="w-full p-2 border rounded mb-3"></textarea>
            <button onclick="saveReflection()" class="bg-blue-600 text-white px-4 py-2 rounded w-full">Save</button>
            <button onclick="closeReflectionModal()" class="bg-gray-300 text-gray-700 px-4 py-2 rounded w-full mt-2">Cancel</button>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/page/login';

        fetch('/api/v1/me', { headers: { 'Authorization': 'Bearer ' + token } })
            .then(r => r.json())
            .then(user => { if (user.is_admin) document.getElementById('adminNavLink').classList.remove('hidden'); });

        let currentBlockId = null;
        let currentBlockDate = null;
        let existingReflections = {};
        const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
        
        window.logout = function() {
            localStorage.removeItem('token');
            window.location.href = '/page/login';
        };
        
        async function loadTimetable() {
            try {
                // Load existing reflections - handle non-array response
                const refRes = await fetch('/api/v1/reflections', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (refRes.ok) {
                    const reflections = await refRes.json();
                    // Ensure reflections is an array
                    if (Array.isArray(reflections)) {
                        existingReflections = {};
                        for (const r of reflections) {
                            existingReflections[`${r.timetable_id}|${r.log_date}`] = r;
                        }
                    }
                }
                
                const res = await fetch('/api/v1/timetable', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                if (!res.ok) {
                    document.getElementById('timetable').innerHTML = '<div class="text-red-500">Error loading timetable</div>';
                    return;
                }
                
                const blocks = await res.json();
                
                // Ensure blocks is an array
                if (!Array.isArray(blocks)) {
                    document.getElementById('timetable').innerHTML = '<div class="text-red-500">Invalid data format</div>';
                    return;
                }
                
                const grouped = {};
                for (let i = 0; i < 7; i++) grouped[i] = [];
                for (const b of blocks) {
                    if (grouped[b.day_of_week]) grouped[b.day_of_week].push(b);
                }
                
                const today = new Date();
                const todayStr = today.toISOString().split('T')[0];
                
                let html = '';
                for (let i = 0; i < 7; i++) {
                    html += `<div class="border rounded-lg p-4 mb-4">`;
                    html += `<h3 class="text-xl font-bold mb-2">${days[i]}</h3>`;
                    
                    if (!grouped[i] || grouped[i].length === 0) {
                        html += `<p class="text-gray-400 italic">No activities planned</p>`;
                    } else {
                        for (const block of grouped[i]) {
                            const reflectionKey = `${block.id}|${todayStr}`;
                            const hasReflection = existingReflections[reflectionKey];
                            
                            let reflectionButton = '';
                            if (!hasReflection) {
                                reflectionButton = `<button onclick="openReflection(${block.id}, '${escapeHtml(block.activity)}', '${todayStr}')" class="bg-blue-600 text-white px-3 py-1 rounded text-sm">Add Reflection</button>`;
                            } else {
                                reflectionButton = `<span class="text-green-600 text-sm">✅ Reflection added</span>`;
                            }
                            
                            html += `
                                <div class="bg-gray-50 p-3 rounded mb-2">
                                    <p><span class="font-bold">${block.start_time} - ${block.end_time}</span></p>
                                    <p><strong>Activity:</strong> ${escapeHtml(block.activity)}</p>
                                    ${block.goal ? `<p class="text-gray-600"><strong>Goal:</strong> ${escapeHtml(block.goal)}</p>` : ''}
                                    <div class="flex gap-2 mt-2">
                                        ${reflectionButton}
                                        <button onclick="deleteBlock(${block.id})" class="bg-red-500 text-white px-3 py-1 rounded text-sm">Delete</button>
                                    </div>
                                </div>
                            `;
                        }
                    }
                    html += `</div>`;
                }
                document.getElementById('timetable').innerHTML = html;
            } catch(e) {
                console.error('Error:', e);
                document.getElementById('timetable').innerHTML = '<div class="text-red-500">Error loading timetable: ' + e.message + '</div>';
            }
        }
        
        let selectedDays = new Set();

        document.getElementById('dayPicker').addEventListener('click', function(e) {
            const chip = e.target.closest('.day-chip');
            if (!chip) return;
            const day = parseInt(chip.dataset.day);
            if (selectedDays.has(day)) {
                selectedDays.delete(day);
                chip.classList.remove('selected');
            } else {
                selectedDays.add(day);
                chip.classList.add('selected');
            }
        });

        window.showAddBlock = function() {
            document.getElementById('addModal').classList.remove('hidden');
            document.getElementById('addModal').classList.add('flex');
            document.getElementById('blockStart').value = '09:00';
            document.getElementById('blockEnd').value = '10:00';
            document.getElementById('blockActivity').value = '';
            document.getElementById('blockGoal').value = '';
            selectedDays.clear();
            document.querySelectorAll('#dayPicker .day-chip').forEach(c => c.classList.remove('selected'));
        };
        
        window.closeAddModal = function() {
            document.getElementById('addModal').classList.add('hidden');
            document.getElementById('addModal').classList.remove('flex');
        };
        
        window.saveTimeBlock = async function() {
            const start = document.getElementById('blockStart').value;
            const end = document.getElementById('blockEnd').value;
            const activity = document.getElementById('blockActivity').value;
            const goal = document.getElementById('blockGoal').value;
            
            if (selectedDays.size === 0) { alert('Select at least one day'); return; }
            if (!activity) { alert('Enter activity'); return; }
            if (start >= end) { alert('End time must be after start'); return; }

            const selectedDaysArr = [...selectedDays];
            let successCount = 0;
            const failedDays = [];

            for (const day of selectedDaysArr) {
                try {
                    const res = await fetch('/api/v1/timetable', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                        body: JSON.stringify({
                            day_of_week: day,
                            start_time: start + ':00',
                            end_time: end + ':00',
                            activity,
                            goal
                        })
                    });
                    if (res.ok) successCount++;
                    else failedDays.push(days[day]);
                } catch (e) {
                    failedDays.push(days[day]);
                }
            }

            closeAddModal();
            loadTimetable();

            if (failedDays.length === 0) {
                alert(successCount > 1 ? `Time block added to ${successCount} days!` : 'Time block added!');
            } else {
                alert(`Added to ${successCount} day(s). Failed for: ${failedDays.join(', ')}`);
            }
        };
        
        window.deleteBlock = async function(id) {
            if (!confirm('Delete this block?')) return;
            const res = await fetch(`/api/v1/timetable/${id}`, { 
                method: 'DELETE', 
                headers: { 'Authorization': 'Bearer ' + token } 
            });
            if (res.ok) loadTimetable();
            else alert('Failed to delete');
        };
        
        window.openReflection = function(blockId, activity, date) {
            currentBlockId = blockId;
            currentBlockDate = date;
            document.getElementById('reflectionTitle').innerHTML = `Reflection: ${activity}`;
            document.getElementById('reflectionDate').innerHTML = `For: ${date}`;
            document.getElementById('reflectionSummary').value = '';
            document.getElementById('reflectionChallenges').value = '';
            document.getElementById('reflectionLearnings').value = '';
            document.getElementById('reflectionModal').classList.remove('hidden');
            document.getElementById('reflectionModal').classList.add('flex');
        };
        
        window.closeReflectionModal = function() {
            document.getElementById('reflectionModal').classList.add('hidden');
            document.getElementById('reflectionModal').classList.remove('flex');
        };
        
        window.saveReflection = async function() {
            const summary = document.getElementById('reflectionSummary').value;
            const challenges = document.getElementById('reflectionChallenges').value;
            const learnings = document.getElementById('reflectionLearnings').value;
            if (!summary) { alert('Please add a summary'); return; }
            
            const res = await fetch('/api/v1/reflections', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ 
                    timetable_id: currentBlockId, 
                    log_date: currentBlockDate, 
                    summary, 
                    challenges, 
                    learnings 
                })
            });
            
            if (res.ok) { 
                closeReflectionModal(); 
                loadTimetable(); 
                alert('Reflection saved!'); 
            } else {
                const data = await res.json();
                alert('Failed: ' + (data.error || 'Unknown error'));
            }
        };
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        loadTimetable();
    
        function toggleDark() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('darkMode', isDark);
            document.getElementById('darkToggle').textContent = isDark ? '☀️' : '🌙';
        }
        // Sync icon on load
        if (localStorage.getItem('darkMode') === 'true') {
            const btn = document.getElementById('darkToggle');
            if (btn) btn.textContent = '☀️';
        }

    </script>
</body>
</html>
