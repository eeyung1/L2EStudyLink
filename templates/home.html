<div class="bg-white rounded-lg shadow p-8">
    <h1 class="text-4xl font-bold text-blue-600 mb-4 text-center">Welcome to L2EStudyLink</h1>
    <p class="text-xl text-gray-600 mb-6 text-center">Find peers. Book sessions. Learn together.</p>
    
    <div id="profile-section" class="mt-8"></div>
    
    <div class="grid md:grid-cols-3 gap-6 mt-8 text-left">
        <div class="border rounded-lg p-4">
            <div class="text-3xl mb-2">🔍</div>
            <h3 class="font-bold text-lg">Find Tutors</h3>
            <p class="text-gray-600 text-sm">Search by skill and find peers who can help</p>
        </div>
        <div class="border rounded-lg p-4">
            <div class="text-3xl mb-2">📅</div>
            <h3 class="font-bold text-lg">Book Sessions</h3>
            <p class="text-gray-600 text-sm">Schedule 1-on-1 study sessions easily</p>
        </div>
        <div class="border rounded-lg p-4">
            <div class="text-3xl mb-2">⭐</div>
            <h3 class="font-bold text-lg">Build Reputation</h3>
            <p class="text-gray-600 text-sm">Get reviews and become a recognized expert</p>
        </div>
    </div>
</div>

<script>
if (currentToken) {
    loadProfile();
}

async function loadProfile() {
    try {
        const res = await fetch('/api/v1/me', {
            headers: { 'Authorization': `Bearer ${currentToken}` }
        });
        const user = await res.json();
        
        document.getElementById('profile-section').innerHTML = `
            <div class="bg-gray-50 rounded-lg p-6 border mb-6">
                <h2 class="text-2xl font-bold mb-4">Your Profile</h2>
                <p><strong>Name:</strong> ${user.name}</p>
                <p><strong>Email:</strong> ${user.email}</p>
                <p><strong>Discord:</strong> ${user.discord_username || 'Not set'}</p>
                <p><strong>Bio:</strong> ${user.bio || 'Not set'}</p>
                <p><strong>Rating:</strong> ⭐ ${user.rating} (${user.total_reviews} reviews)</p>
                <h3 class="font-bold mt-4 mb-2">Your Skills</h3>
                <div id="skills-list">${user.skills?.map(s => `<span class="bg-blue-100 px-3 py-1 rounded-full text-sm mr-2 inline-block mb-2">${s.name} (${s.proficiency})</span>`).join('') || 'None yet'}</div>
                <button onclick="addSkill()" class="mt-4 bg-green-600 text-white px-4 py-2 rounded text-sm mr-2">+ Add Skill</button>
                <button onclick="editProfile()" class="mt-4 bg-blue-600 text-white px-4 py-2 rounded text-sm">Edit Profile</button>
            </div>
        `;
    } catch(e) {
        console.error(e);
    }
}

function addSkill() {
    const skillName = prompt('Enter skill name (e.g., Go, Python, JavaScript):');
    if (!skillName) return;
    const proficiency = prompt('Enter proficiency (beginner/intermediate/advanced):');
    if (!proficiency) return;
    
    fetch('/api/v1/skills', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${currentToken}`
        },
        body: JSON.stringify({ skill_name: skillName, proficiency: proficiency })
    }).then(() => loadProfile());
}

function editProfile() {
    const discord = prompt('Enter your Discord username:');
    const bio = prompt('Enter your bio:');
    
    fetch('/api/v1/profile', {
        method: 'PUT',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${currentToken}`
        },
        body: JSON.stringify({ discord_username: discord || '', bio: bio || '' })
    }).then(() => loadProfile());
}
</script>
