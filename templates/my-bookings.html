<!DOCTYPE html>
<html>
<head>
    <title>My Study Sessions - L2EStudyLink</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
<script>
    // Dark mode: apply before paint to avoid flash
    // Defaults to dark unless the user has explicitly chosen light mode
    (function() {
        if (localStorage.getItem('darkMode') !== 'false') {
            document.documentElement.classList.add('dark');
        }
    })();
</script>
    <link rel="stylesheet" href="/static/css/dark-mode.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body class="bg-gray-100">
    <div class="app-shell">
        <aside class="sidebar">
            <p class="sidebar-brand">L2E<span>Study</span>Link</p>

            <nav class="sidebar-nav">
                <a href="/dashboard" class="sidebar-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>
                    Dashboard
                </a>
                <a href="/search-page" class="sidebar-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
                    Find Study Partners
                </a>
                <a href="/my-bookings" class="sidebar-link active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path><path d="m9 15 2 2 4-4"></path></svg>
                    My Study Sessions
                </a>
                <a href="/timetable" class="sidebar-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path></svg>
                    Timetable
                </a>
                <a href="/reflections" class="sidebar-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"></path></svg>
                    Reflections
                </a>
                <div id="adminNavLink" class="hidden">
                    <a href="/admin" class="sidebar-link">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V5l-8-3Z"></path></svg>
                        Admin
                    </a>
                </div>
            </nav>

            <div class="sidebar-foot">
                <button class="logout-link" onclick="logout()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>
                    Logout
                </button>
                <button id="darkToggle" class="icon-btn" onclick="toggleDark()" title="Toggle dark mode">🌙</button>
            </div>
        </aside>

        <main class="main-content">
    <div class="max-w-4xl mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-2xl font-bold mb-4">My Study Sessions</h2>
            <div id="bookingsList">Loading...</div>
        </div>
    </div>
        </main>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/page/login';

        fetch('/api/v1/me', { headers: { 'Authorization': 'Bearer ' + token } })
            .then(r => r.json())
            .then(user => { if (user.is_admin) document.getElementById('adminNavLink').classList.remove('hidden'); });

        async function logout() {
            localStorage.removeItem('token');
            window.location.href = '/page/login';
        }
        
        async function loadBookings() {
            try {
                const res = await fetch('/api/v1/bookings', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const bookings = await res.json();
                
                if (!bookings || bookings.length === 0) {
                    document.getElementById('bookingsList').innerHTML = '<div class="text-center text-gray-500">No bookings yet</div>';
                    return;
                }
                
                let html = '';
                for (let i = 0; i < bookings.length; i++) {
                    const b = bookings[i];
                    const statusColor = b.status === 'confirmed' ? 'text-green-600' : (b.status === 'pending' ? 'text-yellow-600' : 'text-red-600');
                    
                    html += `
                        <div class="border rounded-lg p-4 mb-3">
                            <p><strong>${b.role === 'tutor' ? 'Teaching' : 'Learning with'} ${b.role === 'tutor' ? b.student_name : b.tutor_name}</strong></p>
                            <p>📅 ${b.date} at ${b.start_time} - ${b.end_time}</p>
                            <p>📚 ${b.topic}</p>
                            <p class="${statusColor}">Status: ${b.status}</p>
                    `;
                    
                    if (b.status === 'pending' && b.role !== 'tutor') {
                        html += `<button onclick="cancelBooking(${b.id})" class="mt-2 bg-red-500 text-white px-3 py-1 rounded text-sm">Cancel</button>`;
                    }
                    
                    if (b.status === 'pending' && b.role === 'tutor') {
                        html += `
                            <button onclick="updateStatus(${b.id}, 'confirmed')" class="mt-2 bg-green-500 text-white px-3 py-1 rounded text-sm mr-2">Accept</button>
                            <button onclick="updateStatus(${b.id}, 'cancelled')" class="mt-2 bg-red-500 text-white px-3 py-1 rounded text-sm">Decline</button>
                        `;
                    }
                    
                    html += `</div>`;
                }
                document.getElementById('bookingsList').innerHTML = html;
            } catch(e) {
                document.getElementById('bookingsList').innerHTML = '<div class="text-center text-red-600">Error loading bookings</div>';
            }
        }
        
        async function cancelBooking(bookingId) {
            if (!confirm('Cancel this booking?')) return;
            
            try {
                const res = await fetch(`/api/v1/bookings/${bookingId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                if (res.ok) {
                    alert('Booking cancelled');
                    loadBookings();
                } else {
                    const data = await res.json();
                    alert('Failed: ' + (data.error || 'Unknown error'));
                }
            } catch(e) {
                alert('Error: ' + e.message);
            }
        }
        
        async function updateStatus(bookingId, status) {
            try {
                const res = await fetch(`/api/v1/bookings/${bookingId}/status`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ status: status })
                });
                
                if (res.ok) {
                    alert(status === 'confirmed' ? 'Booking accepted!' : 'Booking declined');
                    loadBookings();
                } else {
                    const data = await res.json();
                    alert('Failed: ' + (data.error || 'Unknown error'));
                }
            } catch(e) {
                alert('Error: ' + e.message);
            }
        }
        
        loadBookings();
    
        function toggleDark() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('darkMode', isDark);
            document.getElementById('darkToggle').textContent = isDark ? '☀️' : '🌙';
        }
        // Sync icon on load
        if (localStorage.getItem('darkMode') === 'true') {
            const btn = document.getElementById('darkToggle');
            if (btn) btn.textContent = '☀️';
        }

    </script>
</body>
</html>
