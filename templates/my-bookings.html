<!DOCTYPE html>
<html>
<head>
    <title>My Study Sessions - L2EStudyLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <h1 class="text-xl font-bold text-blue-600">L2EStudyLink</h1>
                <div class="flex space-x-4">
                    <a href="/dashboard" class="text-gray-700">Dashboard</a>
                    <a href="/search-page" class="text-gray-700">Find Study Partners</a>
                    <a href="/my-bookings" class="text-gray-700">My Study Sessions</a>
                    <button onclick="logout()" class="text-red-600">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-2xl font-bold mb-4">My Study Sessions</h2>
            <div id="bookingsList">Loading...</div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/page/login';
        
        async function logout() {
            localStorage.removeItem('token');
            window.location.href = '/page/login';
        }
        
        async function loadBookings() {
            try {
                const res = await fetch('/api/v1/bookings', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const bookings = await res.json();
                
                if (!bookings || bookings.length === 0) {
                    document.getElementById('bookingsList').innerHTML = '<div class="text-center text-gray-500">No bookings yet</div>';
                    return;
                }
                
                let html = '';
                for (let i = 0; i < bookings.length; i++) {
                    const b = bookings[i];
                    const statusColor = b.status === 'confirmed' ? 'text-green-600' : (b.status === 'pending' ? 'text-yellow-600' : 'text-red-600');
                    
                    html += `
                        <div class="border rounded-lg p-4 mb-3">
                            <p><strong>${b.role === 'tutor' ? 'Teaching' : 'Learning with'} ${b.role === 'tutor' ? b.student_name : b.tutor_name}</strong></p>
                            <p>📅 ${b.date} at ${b.start_time} - ${b.end_time}</p>
                            <p>📚 ${b.topic}</p>
                            <p class="${statusColor}">Status: ${b.status}</p>
                    `;
                    
                    if (b.status === 'pending' && b.role !== 'tutor') {
                        html += `<button onclick="cancelBooking(${b.id})" class="mt-2 bg-red-500 text-white px-3 py-1 rounded text-sm">Cancel</button>`;
                    }
                    
                    if (b.status === 'pending' && b.role === 'tutor') {
                        html += `
                            <button onclick="updateStatus(${b.id}, 'confirmed')" class="mt-2 bg-green-500 text-white px-3 py-1 rounded text-sm mr-2">Accept</button>
                            <button onclick="updateStatus(${b.id}, 'cancelled')" class="mt-2 bg-red-500 text-white px-3 py-1 rounded text-sm">Decline</button>
                        `;
                    }
                    
                    html += `</div>`;
                }
                document.getElementById('bookingsList').innerHTML = html;
            } catch(e) {
                document.getElementById('bookingsList').innerHTML = '<div class="text-center text-red-600">Error loading bookings</div>';
            }
        }
        
        async function cancelBooking(bookingId) {
            if (!confirm('Cancel this booking?')) return;
            
            try {
                const res = await fetch(`/api/v1/bookings/${bookingId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                if (res.ok) {
                    alert('Booking cancelled');
                    loadBookings();
                } else {
                    const data = await res.json();
                    alert('Failed: ' + (data.error || 'Unknown error'));
                }
            } catch(e) {
                alert('Error: ' + e.message);
            }
        }
        
        async function updateStatus(bookingId, status) {
            try {
                const res = await fetch(`/api/v1/bookings/${bookingId}/status`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ status: status })
                });
                
                if (res.ok) {
                    alert(status === 'confirmed' ? 'Booking accepted!' : 'Booking declined');
                    loadBookings();
                } else {
                    const data = await res.json();
                    alert('Failed: ' + (data.error || 'Unknown error'));
                }
            } catch(e) {
                alert('Error: ' + e.message);
            }
        }
        
        loadBookings();
    </script>
</body>
</html>
