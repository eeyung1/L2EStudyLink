<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="/static/manifest.webmanifest">
    <link rel="icon" href="/static/icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <meta name="theme-color" content="#172537">
    <script src="/static/js/pwa.js" defer></script>
    <meta charset="utf-8">
    <title>Skills - L2EStudyLink</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
    <script>
        (function() {
            if (localStorage.getItem('darkMode') !== 'false') {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <link rel="stylesheet" href="/static/css/dark-mode.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <link rel="stylesheet" href="/static/css/ui-polish.css">
    <script src="/static/js/mobile-nav.js" defer></script>
    <style>body { font-family: 'Inter', -apple-system, sans-serif; margin: 0; }</style>
    <script src="/static/js/session.js"></script>
    <link rel="stylesheet" href="/static/redesign/tokens.css">
    <link rel="stylesheet" href="/static/css/workspace.css">
</head>
<body class="l2e-workspace ">
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-heading">
                <a class="sidebar-brand" href="/dashboard" aria-label="L2EStudyLink dashboard">L2E<span>Study</span>Link</a>
                <button class="mobile-menu-toggle" type="button" aria-label="Open navigation" aria-controls="mobile-navigation" aria-expanded="false">
                    <span class="menu-icon" aria-hidden="true">☰</span>
                    <span class="menu-label">Menu</span>
                </button>
            </div>

            {{template "app-navigation" .}}

            <div class="sidebar-foot">
                <button class="logout-link" onclick="logout()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>
                    Logout
                </button>
                <button id="darkToggle" class="icon-btn" onclick="toggleDark()" title="Toggle dark mode">🌙</button>
            </div>
        </aside>

        <main class="main-content settings-page"><div id="settingsNotice" class="settings-notice" role="status" aria-live="polite"></div><header class="workspace-header"><div><p class="workspace-eyebrow">YOUR EXPERTISE</p><h1 class="workspace-title">Your skills</h1><p class="workspace-subtitle">Share what you know, and keep your profile ready for new opportunities.</p></div></header>
                    <div id="skillsSection" class="card">
                        <h2>Skills you share</h2><p class="page-sub">Keep these up to date so people discover what you can teach and build.</p>
                        <div id="skills" class="mb-4"></div>
                        <form id="skillForm" class="field-row">
                            <label class="sr-only" for="newSkillName">Skill name</label><input type="text" id="newSkillName" required maxlength="50" placeholder="Skill name (e.g., Go, Python)">
                            <label class="sr-only" for="newSkillProficiency">Proficiency</label><select id="newSkillProficiency">
                                <option value="beginner">Beginner</option>
                                <option value="intermediate">Intermediate</option>
                                <option value="advanced">Advanced</option>
                            </select>
                            <button type="submit" id="skillSubmit" class="btn-add">Add skill</button><button type="button" id="cancelSkillEdit" class="btn-outline" hidden>Cancel</button>
                        </form>
                    </div>

        </main></div>
<script src="/static/js/settings.js" defer></script>
</body></html>
