<div class="bg-white rounded-lg shadow p-8 max-w-md mx-auto">
    <h2 class="text-2xl font-bold mb-6 text-center">Login to L2EStudyLink</h2>
    
    <form id="login-form" onsubmit="handleLogin(event)">
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">Email</label>
            <input type="email" id="login-email" required class="w-full p-2 border rounded focus:outline-none focus:border-blue-500">
        </div>
        <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
            <input type="password" id="login-password" required class="w-full p-2 border rounded focus:outline-none focus:border-blue-500">
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Login</button>
    </form>
    
    <p class="text-center text-gray-600 mt-4 text-sm">
        Don't have an account? 
        <a href="#" onclick="showSignup(); return false;" class="text-blue-600 hover:underline">Sign up</a>
    </p>
    
    <div id="login-error" class="mt-4 text-red-600 text-sm text-center hidden"></div>
</div>

<script>
async function handleLogin(event) {
    event.preventDefault();
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    const errorDiv = document.getElementById('login-error');
    
    errorDiv.classList.add('hidden');
    
    try {
        console.log('Logging in with:', email);
        
        const response = await fetch('/api/v1/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        
        const data = await response.json();
        console.log('Login response:', data);
        
        if (response.ok && data.token) {
            localStorage.setItem('token', data.token);
            currentToken = data.token;
            updateUI();
            loadPage('home');
        } else {
            errorDiv.textContent = data.error || 'Login failed';
            errorDiv.classList.remove('hidden');
        }
    } catch(e) {
        console.error('Login error:', e);
        errorDiv.textContent = 'Network error. Please try again.';
        errorDiv.classList.remove('hidden');
    }
}
</script>
