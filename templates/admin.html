<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard - L2EStudyLink</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
<script>
    // Dark mode: apply before paint to avoid flash
    // Defaults to dark unless the user has explicitly chosen light mode
    (function() {
        if (localStorage.getItem('darkMode') !== 'false') {
            document.documentElement.classList.add('dark');
        }
    })();
</script>
    <link rel="stylesheet" href="/static/css/dark-mode.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body class="bg-gray-100">
    <div class="app-shell">
        <aside class="sidebar">
            <p class="sidebar-brand">L2E<span>Study</span>Link</p>

            <nav class="sidebar-nav">
                <a href="/dashboard" class="sidebar-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>
                    Dashboard
                </a>
                <a href="/search-page" class="sidebar-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
                    Find Study Partners
                </a>
                <a href="/my-bookings" class="sidebar-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path><path d="m9 15 2 2 4-4"></path></svg>
                    My Study Sessions
                </a>
                <a href="/timetable" class="sidebar-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path></svg>
                    Timetable
                </a>
                <a href="/reflections" class="sidebar-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"></path></svg>
                    Reflections
                </a>
                <a href="/admin" class="sidebar-link active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V5l-8-3Z"></path></svg>
                    Admin
                </a>
            </nav>

            <div class="sidebar-foot">
                <button class="logout-link" onclick="logout()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>
                    Logout
                </button>
                <button id="darkToggle" class="icon-btn" onclick="toggleDark()" title="Toggle dark mode">🌙</button>
            </div>
        </aside>

        <main class="main-content">
    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- Stats Cards -->
        <div class="grid md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow p-6 text-center">
                <div class="text-3xl font-bold text-blue-600" id="totalUsers">-</div>
                <div class="text-gray-600">Total Users</div>
            </div>
            <div class="bg-white rounded-lg shadow p-6 text-center">
                <div class="text-3xl font-bold text-green-600" id="totalBookings">-</div>
                <div class="text-gray-600">Total Bookings</div>
            </div>
            <div class="bg-white rounded-lg shadow p-6 text-center">
                <div class="text-3xl font-bold text-purple-600" id="totalSkills">-</div>
                <div class="text-gray-600">Total Skills</div>
            </div>
        </div>

        <!-- Users Table -->
        <div class="bg-white rounded-lg shadow p-6 mb-8">
            <h2 class="text-2xl font-bold mb-4">Users</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-gray-100">
                        <tr><th class="p-2 text-left">ID</th><th class="p-2 text-left">Name</th><th class="p-2 text-left">Email</th><th class="p-2 text-left">Rating</th><th class="p-2 text-left">Sessions</th><th class="p-2 text-left">No-Shows</th><th class="p-2 text-left">Status</th><th class="p-2 text-left">Actions</th></tr>
                    </thead>
                    <tbody id="usersTable"></tbody>
                </table>
            </div>
        </div>

        <!-- Bookings Table -->
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-2xl font-bold mb-4">All Bookings</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-gray-100">
                        <tr><th class="p-2 text-left">ID</th><th class="p-2 text-left">Tutor</th><th class="p-2 text-left">Student</th><th class="p-2 text-left">Date</th><th class="p-2 text-left">Time</th><th class="p-2 text-left">Status</th></tr>
                    </thead>
                    <tbody id="bookingsTable"></tbody>
                </table>
            </div>
        </div>
    </div>
        </main>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/page/login';
        }
        
        async function logout() {
            localStorage.removeItem('token');
            window.location.href = '/page/login';
        }
        
        async function loadStats() {
            const res = await fetch('/api/v1/admin/stats', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const stats = await res.json();
            document.getElementById('totalUsers').innerText = stats.total_users;
            document.getElementById('totalBookings').innerText = stats.total_bookings;
            document.getElementById('totalSkills').innerText = stats.total_skills;
        }
        
        async function loadUsers() {
            const res = await fetch('/api/v1/admin/users', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const users = await res.json();
            
            let html = '';
            for (const u of users) {
                const statusBadge = u.is_suspended ? 
                    '<span class="bg-red-100 text-red-800 px-2 py-1 rounded text-xs">Suspended</span>' : 
                    '<span class="bg-green-100 text-green-800 px-2 py-1 rounded text-xs">Active</span>';
                
                html += `
                    <tr class="border-b">
                        <td class="p-2">${u.id}</td>
                        <td class="p-2">${u.name} ${u.is_admin ? '👑' : ''}</td>
                        <td class="p-2">${u.email}</td>
                        <td class="p-2">⭐ ${u.rating}</td>
                        <td class="p-2">${u.total_sessions}</td>
                        <td class="p-2">${u.no_show_count}</td>
                        <td class="p-2">${statusBadge}</td>
                        <td class="p-2">
                            <button onclick="toggleSuspend(${u.id})" class="bg-yellow-500 text-white px-2 py-1 rounded text-xs mr-1">${u.is_suspended ? 'Unsuspend' : 'Suspend'}</button>
                            <button onclick="deleteUser(${u.id})" class="bg-red-600 text-white px-2 py-1 rounded text-xs">Delete</button>
                        </td>
                    </tr>
                `;
            }
            document.getElementById('usersTable').innerHTML = html;
        }
        
        async function loadBookings() {
            const res = await fetch('/api/v1/admin/bookings', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const bookings = await res.json();
            
            let html = '';
            for (const b of bookings) {
                const statusColor = b.status === 'confirmed' ? 'text-green-600' : 
                                   (b.status === 'pending' ? 'text-yellow-600' : 'text-red-600');
                html += `
                    <tr class="border-b">
                        <td class="p-2">${b.id}</td>
                        <td class="p-2">${b.tutor}</td>
                        <td class="p-2">${b.student}</td>
                        <td class="p-2">${b.date}</td>
                        <td class="p-2">${b.time}</td>
                        <td class="p-2 ${statusColor}">${b.status}</td>
                    </tr>
                `;
            }
            document.getElementById('bookingsTable').innerHTML = html;
        }
        
        async function toggleSuspend(userId) {
            const res = await fetch(`/api/v1/admin/users/${userId}/suspend`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) {
                loadUsers();
            } else {
                alert('Failed to toggle suspension');
            }
        }
        
        async function deleteUser(userId) {
            if (!confirm('Are you sure? This will delete all their data.')) return;
            
            const res = await fetch(`/api/v1/admin/users/${userId}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) {
                loadUsers();
                loadStats();
            } else {
                alert('Failed to delete user');
            }
        }
        
        loadStats();
        loadUsers();
        loadBookings();
    
        function toggleDark() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('darkMode', isDark);
            document.getElementById('darkToggle').textContent = isDark ? '☀️' : '🌙';
        }
        // Sync icon on load
        if (localStorage.getItem('darkMode') === 'true') {
            const btn = document.getElementById('darkToggle');
            if (btn) btn.textContent = '☀️';
        }

    </script>
</body>
</html>
