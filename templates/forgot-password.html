<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password - L2EStudyLink</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
    <div class="max-w-md mx-auto">
        <div class="rounded-lg shadow p-8" style="background:#12151f; color:#e5e7eb; border:1px solid rgba(255,255,255,0.08);">
            <h1 class="text-2xl font-bold text-center mb-6" style="color:#7c3aed;"><a class="auth-brand-link" href="/">L2EStudyLink</a></h1>
            <h2 class="text-xl font-bold mb-2 text-center">Forgot Password</h2>
            <p class="text-center text-sm mb-6" style="color:#9ca3af;">
                Enter your email and we'll send you a six-digit verification code.
            </p>

            <form id="forgotForm">
                <div class="mb-6">
                    <label class="block text-sm font-bold mb-2" style="color:#d1d5db;">Email</label>
                    <input type="email" id="email" required class="w-full p-2 rounded focus:outline-none" style="background:#1f2330; color:#f3f4f6; border:1px solid #374151;">
                </div>
                <button type="submit" class="w-full text-white py-2 rounded" style="background:#7c3aed;" onmouseover="this.style.background='#6d28d9'" onmouseout="this.style.background='#7c3aed'">
                    Send Code
                </button>
            </form>

            <p class="text-center mt-4 text-sm" style="color:#9ca3af;">
                Remembered your password?
                <a href="/page/login" style="color:#a78bfa;" class="hover:underline">Log in</a>
            </p>

            <div id="message" class="mt-4 text-sm text-center hidden"></div>
        </div>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const messageDiv = document.getElementById('message');
            const submitBtn = e.target.querySelector('button[type="submit"]');

            messageDiv.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';

            try {
                const response = await fetch('/api/v1/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (response.ok) {
                    window.location.href = '/page/reset-password?email=' + encodeURIComponent(email.trim());
                    return;
                }
                messageDiv.style.color = '#f87171';
                messageDiv.textContent = data.error || 'Something went wrong.';
                messageDiv.classList.remove('hidden');
            } catch (err) {
                messageDiv.style.color = '#f87171';
                messageDiv.textContent = 'Network error. Please try again.';
                messageDiv.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Code';
            }
        });
    </script>
</body>
</html>
