name: Go checks
on:
  pull_request:
  push:
    branches: [main, feat/project-collaboration]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: l2e_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d l2e_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/l2e_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod tidy
      - uses: actions/upload-artifact@v4
        with:
          name: module-checksums
          path: |
            go.mod
            go.sum
      - run: go test ./...
      - run: go build ./...
      - run: node --test static/js/read-api.test.cjs
      - name: Check SQLite schema
        run: python3 -c "import sqlite3; sqlite3.connect(':memory:').executescript(open('schema.sqlite').read())"
